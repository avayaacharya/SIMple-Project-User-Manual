kind = "web"
previewPath = "/"
title = "SIMple Manual do Utilizador"
version = "1.0.0"
id = "artifacts/simple-manual"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25393

[services.development]
run = "pnpm --filter @workspace/simple-manual run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simple-manual", "run", "build" ]
publicDir = "artifacts/simple-manual/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25393"
BASE_PATH = "/"
